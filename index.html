<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیاری بۆ خاتوو شنە</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffccd5, #ffe5ec, #fff0f3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background floating hearts and sparkles */
        .sparkle {
            position: absolute;
            background: #ff4d6d;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: floatSparkle 4s infinite ease-in-out;
            opacity: 0.6;
            z-index: 1;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(0) scale(0.8); opacity: 0.4; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 0.9; }
            100% { transform: translateY(0) scale(0.8); opacity: 0.4; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 135, 0.2);
            max-width: 500px;
            width: 90%;
            border: 3px solid #ff758c;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #d81b60;
            font-size: 26px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* Gift Box Styles */
        .gift-box {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.08);
        }

        .box-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border-radius: 0 0 15px 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .box-lid {
            position: absolute;
            top: 15px;
            left: -10px;
            width: 180px;
            height: 35px;
            background: linear-gradient(135deg, #ff5252. #ff758c);
            background: linear-gradient(135deg, #ff4d6d, #ff758c);
            border-radius: 8px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            transition: transform 0.5s ease, top 0.5s ease;
        }

        .ribbon-vertical {
            position: absolute;
            width: 30px;
            height: 100%;
            background: #ffd166;
            left: 65px;
        }

        .ribbon-horizontal {
            position: absolute;
            top: 45px;
            width: 100%;
            height: 30px;
            background: #ffd166;
        }

        .bow {
            position: absolute;
            top: -15px;
            left: 60px;
            width: 40px;
            height: 30px;
            background: #ffd166;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        /* Opened State Animation */
        .gift-box.open .box-lid {
            transform: translateY(-80px) rotate(-15deg);
            opacity: 0.8;
        }

        /* Hidden Content Reveal */
        .hidden-content {
            display: none;
            margin-top: 20px;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cute-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid #ffccd5;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        .message {
            font-size: 24px;
            color: #c9184a;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,192,203,0.8);
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .instruction {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Background Sparkles -->
    <div class="sparkle" style="top: 10%; left: 15%; width: 20px; height: 20px; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 20%; right: 20%; width: 25px; height: 25px; animation-delay: 1s;"></div>
    <div class="sparkle" style="bottom: 15%; left: 25%; width: 18px; height: 18px; animation-delay: 2s;"></div>
    <div class="sparkle" style="bottom: 20%; right: 15%; width: 22px; height: 22px; animation-delay: 1.5s;"></div>

    <div class="container">
        <div id="box-section">
            <h1>خاتوو شنە ئەم بۆکسە بکەوە</h1>
            <div class="gift-box" id="giftBox" onclick="openGift()">
                <div class="box-lid">
                    <div class="bow"></div>
                </div>
                <div class="box-body">
                    <div class="ribbon-vertical"></div>
                    <div class="ribbon-horizontal"></div>
                </div>
            </div>
            <p class="instruction">( بۆکسەکە کلیک بکە )</p>
        </div>

        <div class="hidden-content" id="hiddenContent">
            <!-- وێنەی ڕاستەقینەی پشیلە و گووڵ -->
            <img src="https://images.unsplash.com/photo-1548802673-380ab8ebc7b7?auto=format&fit=crop&w=600&q=80" alt="Cute Cat with Flowers" class="cute-img">
            <div class="message">فەرموو بۆتۆی بەڕێز 🌸🐱</div>
        </div>
    </div>

    <script>
        function openGift() {
            const box = document.getElementById('giftBox');
            const boxSection = document.getElementById('box-section');
            const hiddenContent = document.getElementById('hiddenContent');

            box.classList.add('open');

            setTimeout(() => {
                boxSection.style.display = 'none';
                hiddenContent.style.display = 'block';
            }, 400);
        }
    </script>
</body>
</html>
